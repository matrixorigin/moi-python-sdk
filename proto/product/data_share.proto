syntax = "proto3";

package matrixflow.sdk.product;

option go_package = "github.com/matrixorigin/moi-go-sdk/v5/product";

message PublishSummaryResult {
  int64 total = 1;
  int64 target_total = 2 [json_name = "target_total"];
}

message CheckNameResult {
  bool available = 1;
}

message DataSharePublishTarget {
  string workspace_id = 1 [json_name = "workspace_id"];
  string workspace_name = 2 [json_name = "workspace_name"];
}

message DataShareWorkspaceName {
  string id = 1;
  string name = 2;
}

message DataShareWorkspaceNameListResult {
  repeated DataShareWorkspaceName workspaces = 1;
}

message DataShareScope {
  string mode = 1;
  repeated string object_ids = 2 [json_name = "object_ids"];
}

message DataShareSourceTable {
  string id = 1;
  string name = 2;
}

message DataShareSourceTableListResult {
  repeated DataShareSourceTable list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4 [json_name = "page_size"];
}

message DataSharePublish {
  reserved 3 to 7;
  reserved "obj_id", "obj_name", "obj_type", "obj_path", "tables";
  string id = 1;
  string name = 2;
  repeated DataSharePublishTarget targets = 8;
  string permission = 9;
  string remark = 10;
  string created_by = 11 [json_name = "created_by"];
  string created_at = 12 [json_name = "created_at"];
  string updated_at = 13 [json_name = "updated_at"];
  string obj_display_name = 14 [json_name = "obj_display_name"];
  string obj_display_path = 15 [json_name = "obj_display_path"];
  string source_database_id = 16 [json_name = "source_database_id"];
  string mo_database_name = 17 [json_name = "mo_database_name"];
  DataShareScope table_scope = 18 [json_name = "table_scope"];
  // Empty for normal records; running or failed for an unfinished deletion.
  string cleanup_status = 19 [json_name = "cleanup_status"];
}

message DataSharePublishListResult {
  repeated DataSharePublish list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4 [json_name = "page_size"];
}

message DataShareSubscription {
  reserved 3 to 6, 13, 14;
  reserved "obj_name", "obj_type", "obj_path", "tables", "sub_location_id", "sub_location_path";
  string id = 1;
  string pub_name = 2 [json_name = "pub_name"];
  string source_workspace_id = 7 [json_name = "source_workspace_id"];
  string source_workspace_name = 8 [json_name = "source_workspace_name"];
  string publisher = 9;
  string published_at = 10 [json_name = "published_at"];
  string status = 11;
  string sub_name = 12 [json_name = "sub_name"];
  string subscribed_by = 15 [json_name = "subscribed_by"];
  string created_at = 16 [json_name = "created_at"];
  string obj_display_name = 17 [json_name = "obj_display_name"];
  string obj_display_path = 18 [json_name = "obj_display_path"];
  string source_database_id = 19 [json_name = "source_database_id"];
  string mo_database_name = 20 [json_name = "mo_database_name"];
  DataShareScope table_scope = 21 [json_name = "table_scope"];
  string target_database_id = 22 [json_name = "target_database_id"];
  string cleanup_status = 23 [json_name = "cleanup_status"];
}

message DataShareSubscriptionListResult {
  repeated DataShareSubscription list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4 [json_name = "page_size"];
}

message DataShareRecoveryApproval {bool catalog_workload_stopped=1;bool all_cn_data_share_ddl_drained=2;bool exact_readback_confirmed=3;}
message DataShareDDLRecoveryRequest {string saga_id=1;bool apply=2;DataShareRecoveryApproval approval=3;}
message DataShareDDLRecoveryResult {string saga_id=1;string saga_name=2;string step_name=3;string resolution=4;string status=5;}
message DataShareSagaTerminationRequest {string saga_id=1;bool apply=2;DataShareRecoveryApproval approval=3;}
message DataShareSagaTerminationResult {string saga_id=1;string saga_name=2;string status=3;}
