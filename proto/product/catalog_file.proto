syntax = "proto3";

package matrixflow.sdk.product;

import "google/protobuf/struct.proto";

option go_package = "github.com/matrixorigin/moi-go-sdk/v5/product";

message TriggerFileWorkflowResult {
  int32 triggered = 1;
}

message UploadFileResult {
  string file_id = 1;
  string original_name = 2 [json_name = "original_name"];
  int64 size = 3;
  string md5 = 4;
  CatalogFileUploadLocation catalog_file = 5 [json_name = "catalog_file"];
}

// RuntimeArtifactUploadResult is the task-scoped result returned after a
// sandbox child publishes one file into its caller's private Catalog volume.
message RuntimeArtifactUploadResult {
  string file_id = 1;
  string original_name = 2 [json_name = "original_name"];
  int64 size = 3;
  string md5 = 4;
  string artifact_id = 5 [json_name = "artifact_id"];
  string sha256 = 6;
}

// RuntimeImageAnalysisResult is the answer returned for one task-scoped
// sandbox image-analysis request.
message RuntimeImageAnalysisResult {
  string answer = 1;
}

message FileInfoResult {
  string file_id = 1;
  string file_name = 2;
  int64 size = 3;
  // Catalog file storage contract (issue #19365): "managed" content lives in
  // MOI object storage; "external" content stays at the source connector.
  string storage_mode = 4 [json_name = "storage_mode"];
  string external_connector_id = 5 [json_name = "external_connector_id"];
  string external_uri = 6 [json_name = "external_uri"];
}

message CatalogFileFolder {
  string id = 1;
  string name = 2;
  string file_type = 3 [json_name = "file_type"];
  string workflow_role = 4 [json_name = "workflow_role"];
  string file_ext = 5 [json_name = "file_ext"];
  string origin_file_name = 6 [json_name = "origin_file_name"];
  string origin_file_ext = 7 [json_name = "origin_file_ext"];
  string ref_file_id = 8 [json_name = "ref_file_id"];
  string parsed_file_id = 9 [json_name = "parsed_file_id"];
  int64 size = 10;
  string parent_id = 11 [json_name = "parent_id"];
  string created_at = 12 [json_name = "created_at"];
  string created_by = 13 [json_name = "created_by"];
  string volume_id = 14 [json_name = "volume_id"];
  string volume_name = 15 [json_name = "volume_name"];
  bool volume_reserved = 16 [json_name = "volume_reserved"];
  string ref_workflow_id = 17 [json_name = "ref_workflow_id"];
  string file_path = 18 [json_name = "file_path"];
  string storage_mode = 19 [json_name = "storage_mode"];
  string external_connector_id = 20 [json_name = "external_connector_id"];
  string external_uri = 21 [json_name = "external_uri"];
}

message CatalogFileListResult {
  int64 total = 1;
  repeated CatalogFileFolder list = 2;
}

// One IAM-visible placement of a file, including its original metadata.
message WorkspaceFilePlacement {
  int64 id = 1;
  int64 volume_id = 2 [json_name = "volume_id"];
  string file_id = 3 [json_name = "file_id"];
  string file_name = 4 [json_name = "file_name"];
  string file_path = 5 [json_name = "file_path"];
  int64 created_at = 6 [json_name = "created_at"];
  string created_by = 7 [json_name = "created_by"];
  int64 updated_at = 8 [json_name = "updated_at"];
  string updated_by = 9 [json_name = "updated_by"];
  string original_name = 10 [json_name = "original_name"];
  string md5 = 11;
  int64 size = 12;
  int32 ref_count = 13 [json_name = "ref_count"];
  int64 revision = 14;
  string source = 15;
  string source_session_id = 16 [json_name = "source_session_id"];
  string source_task_id = 17 [json_name = "source_task_id"];
  string source_call_id = 18 [json_name = "source_call_id"];
  string content_type = 19 [json_name = "content_type"];
  string source_tool = 20 [json_name = "source_tool"];
  string sandbox_path = 21 [json_name = "sandbox_path"];
}

message WorkspaceFileListResult {
  repeated WorkspaceFilePlacement items = 1;
  int64 total = 2;
  string next_page_token = 3 [json_name = "next_page_token"];
}

message CatalogPreviewExcelResult {
  string link = 1;
}

message CatalogDataAsset {
  int64 id = 1;
  string asset_id = 2 [json_name = "asset_id"];
  string name = 3;
  string raw_file_id = 4 [json_name = "raw_file_id"];
  int64 volume_id = 5 [json_name = "volume_id"];
  string source = 6;
  google.protobuf.Struct meta = 7;
  int64 created_at = 8 [json_name = "created_at"];
  int64 updated_at = 9 [json_name = "updated_at"];
  string asset_type = 10 [json_name = "asset_type"];
  string asset_ref = 11 [json_name = "asset_ref"];
}

message CatalogDataDerivation {
  int64 id = 1;
  string asset_id = 2 [json_name = "asset_id"];
  string kind = 3;
  string file_id = 4 [json_name = "file_id"];
  google.protobuf.Struct meta = 5;
  int64 created_at = 6 [json_name = "created_at"];
  int64 updated_at = 7 [json_name = "updated_at"];
  string root_asset_id = 8 [json_name = "root_asset_id"];
  string source_asset_id = 9 [json_name = "source_asset_id"];
  string target_asset_id = 10 [json_name = "target_asset_id"];
  string case_id = 11 [json_name = "case_id"];
  string producer_workitem_id = 12 [json_name = "producer_workitem_id"];
  string recorded_by_workitem_id = 13 [json_name = "recorded_by_workitem_id"];
  int32 parallel_index = 14 [json_name = "parallel_index"];
  string logical_slot = 15 [json_name = "logical_slot"];
  string idempotency_key = 16 [json_name = "idempotency_key"];
}

message CatalogParsedManifest {
  int64 id = 1;
  string asset_id = 2 [json_name = "asset_id"];
  string raw_file_id = 3 [json_name = "raw_file_id"];
  string parsed_file_id = 4 [json_name = "parsed_file_id"];
  google.protobuf.Struct manifest = 5;
  int64 created_at = 6 [json_name = "created_at"];
  int64 updated_at = 7 [json_name = "updated_at"];
  string root_asset_id = 8 [json_name = "root_asset_id"];
  string source_file_id = 9 [json_name = "source_file_id"];
  string parsed_asset_id = 10 [json_name = "parsed_asset_id"];
}

message CatalogDataAssetResolveResult {
  CatalogDataAsset asset = 1;
  repeated CatalogDataDerivation derivations = 2;
  CatalogParsedManifest manifest = 3;
  map<string, CatalogDataAsset> assets_by_id = 4 [json_name = "assets_by_id"];
}

message CatalogBatchGetDataAssetsResult {
  repeated CatalogDataAsset items = 1;
  int64 total = 2;
}

message CatalogFileArtifactResult {
  string file_id = 1 [json_name = "file_id"];
  bool file_exists = 2 [json_name = "file_exists"];
  bool has_artifact = 3 [json_name = "has_artifact"];
  string source_file_id = 4 [json_name = "source_file_id"];
  string parsed_file_id = 5 [json_name = "parsed_file_id"];
  google.protobuf.Struct root_asset = 6 [json_name = "root_asset"];
  google.protobuf.Struct stage_asset = 7 [json_name = "stage_asset"];
  google.protobuf.Struct parsed_asset = 8 [json_name = "parsed_asset"];
  repeated google.protobuf.Struct derivations = 9;
  google.protobuf.Struct manifest = 10;
  map<string, google.protobuf.Struct> assets_by_id = 11 [json_name = "assets_by_id"];
}

message CatalogFileArtifactResolveItem {
  string file_id = 1 [json_name = "file_id"];
  bool file_exists = 2 [json_name = "file_exists"];
  bool has_artifact = 3 [json_name = "has_artifact"];
  string source_file_id = 4 [json_name = "source_file_id"];
  string parsed_file_id = 5 [json_name = "parsed_file_id"];
  string root_asset_id = 6 [json_name = "root_asset_id"];
  string stage_asset_id = 7 [json_name = "stage_asset_id"];
  string parsed_asset_id = 8 [json_name = "parsed_asset_id"];
  string origin_file_name = 9 [json_name = "origin_file_name"];
  string origin_file_ext = 10 [json_name = "origin_file_ext"];
  int64 volume_id = 11 [json_name = "volume_id"];
}

message CatalogBatchResolveFileArtifactsResult {
  repeated CatalogFileArtifactResolveItem items = 1;
}

message CatalogFileUploadLocation {
  string workspace_id = 1 [json_name = "workspace_id"];
  int64 volume_id = 2 [json_name = "volume_id"];
  string file_id = 3 [json_name = "file_id"];
  string path = 4;
  string name = 5;
  int64 size = 6;
  string md5 = 7;
}
