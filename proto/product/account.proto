syntax = "proto3";

package matrixflow.sdk.product;

import "product/workspace.proto";

option go_package = "github.com/matrixorigin/moi-go-sdk/v5/product";

message AccountDetailResult {
  string uid = 1;
  string email = 2;
  string mobile_number = 3;
  string firstname = 4;
  string lastname = 5;
  string company = 6;
  string organization = 7;
  bool agreed_to_policy = 8;
  string name = 9;
  string quick_start_status = 10;
  int32 free_experiences = 11;
  int32 total_free_experiences = 12;
  int64 create_timestamp = 13;
  string email_status = 14;
  string mobile_number_status = 15;
  string frontend_data = 16;
  repeated AccountSSOIdentity identities = 17;
  optional bool password_set = 18;
  string profile_updated_at = 19;
}

message AccountSSOIdentity {
  string provider = 1;
  string provider_email = 2;
  string display_name = 3;
  bool email_verified = 4;
  string bound_at = 5;
}

message AccountIDResult {
  string id = 1;
}

message APIKeyPreviewResult {
  string key = 1;
  string created_at = 2;
}

message APIKeyRevealResult {
  string api_key = 1;
}

message DBConnectionResult {
  string host = 1;
  int32 port = 2;
  string database = 3;
  string account_name = 4;
  string username = 5;
  string password = 6;
  repeated string session_init_sqls = 7;
  string effective_role_id = 8;
  string effective_role_db_role = 9;
  string effective_role_source = 10;
  string effective_role_version = 11;
}

message BrowserLoginCallbackRequest {string code=1; string state=2; string error=3;}
message NativeWorkspaceInitialization {
  string status = 1;
  string job_id = 2;
  string code = 3;
  string message = 4;
}
message NativeBootstrapResult {
  string issuer = 1;
  string subject = 2;
  string session_id = 3;
  string principal_id = 4;
  string catalog_user_id = 5;
  repeated Workspace workspaces = 6;
  NativeWorkspaceInitialization workspace_initialization = 7;
}
message BrowserSessionResult {string uc_sub=1;string uid=2;string email=3;string display_name=4;string csrf_token=5;string login_channel=6;}
message BrowserLogoutRequest {optional string locale=1; optional string return_to=2;}
message BrowserLogoutResult {string logout_url=1;}
message AuthPreferencesRequest {optional string locale=1; optional string timezone=2;}
message AuthPreferencesResult {string locale=1;string timezone=2;string updated_at=3;}
message SystemComponentVersion {
  string component = 1;
  string version = 2;
  string status = 3;
  string build_time = 4;
  string git_commit = 5;
  string branch_name = 6;
  string go_version = 7;
}
message SystemVersionsResult {repeated SystemComponentVersion backend_components=1; string request_time=2;}
message WebappLogo {string favicon=1;string primary=2;string mini=3;}
message WebappConfigResult {string name=1;string title=2;string auth_provider=3;WebappLogo logo=4;}
message SystemRouteCoverageResult {
  repeated string registered = 1;
  map<string, uint64> hits = 2;
  repeated string root_registered = 3 [json_name = "root_registered"];
  message TestOwnerHits { map<string, uint64> owners = 1; }
  map<string, TestOwnerHits> test_hits = 4 [json_name = "test_hits"];
}

// Original product-header read contract.
message CurrentCreditResult { string credit_available = 1; }

// Source administrative meter activation result; change IDs remain private.
message BillingMeterRolloutResult {
  string meter_code = 1;
  string status = 2;
  bool changed = 3;
}

message ServiceAccountWorkspace {string workspace_id=1;string display_name=2;string remote_version=3;}
message ServiceAccountWorkspaceList {repeated ServiceAccountWorkspace items=1;}
message ServiceAccountRole {int64 role_id=1;string display_name=2;}
message ServiceAccountRoleList {repeated ServiceAccountRole items=1;string remote_version=2;}
