syntax = "proto3";

package matrixflow.sdk.product;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/matrixorigin/moi-go-sdk/v5/product";

message SQLWorkbook {
  string workbook_id = 1 [json_name = "workbook_id"];
  string name = 2;
}

message SQLWorkbookListResult {
  int64 total = 1;
  repeated SQLWorkbook result = 2;
  string next_page_token = 3 [json_name = "next_page_token"];
}

message SQLWorkbookDetailResult {
  string sql_content = 1 [json_name = "sql_content"];
  google.protobuf.Timestamp created_at = 2 [json_name = "created_at"];
  google.protobuf.Timestamp updated_at = 3 [json_name = "updated_at"];
}

message SQLWorkbookVersion {
  string id = 1;
  string name = 2;
  string status = 3;
}

message SQLWorkbookVersionListResult {
  int64 total = 1;
  repeated SQLWorkbookVersion result = 2;
  string next_page_token = 3 [json_name = "next_page_token"];
}

message SQLWorkbookVersionCreateResult {
  string id = 1;
  string version = 2;
  string status = 3;
}

message SQLDatabaseMetadata {
  string db_name = 1 [json_name = "db_name"];
  string db_owner = 2 [json_name = "db_owner"];
  bool is_internal = 3 [json_name = "is_internal"];
  bool is_subscription = 4 [json_name = "is_subscription"];
  bool has_published = 5 [json_name = "has_published"];
  SQLTableGroup tables = 6;
  SQLTableGroup views = 7;
  // Optional product-facing label from Catalog display bindings; may equal db_name.
  string display_name = 8 [json_name = "display_name"];
}

message SQLDatabaseListResult {
  repeated SQLDatabaseMetadata result = 1;
  int64 total = 2;
  string next_page_token = 3 [json_name = "next_page_token"];
}

message SQLDatabaseTreeResult {
  repeated SQLDatabaseMetadata db_list = 1 [json_name = "db_list"];
}

message SQLTableMetadata {
  string name = 1;
  string owner = 2;
  string created = 3;
  int64 rows = 4;
  int64 size = 5;
}

message SQLTableGroup {
  repeated SQLTableMetadata tables = 1;
  int64 total = 2;
}

message SQLDatabaseTablesResult {
  string db_name = 1 [json_name = "db_name"];
  SQLTableGroup tables = 2;
  SQLTableGroup views = 3;
}

message SQLColumnMetadata {
  string name = 1;
  string data_type = 2 [json_name = "data_type"];
  string nullable = 3;
  string default_value = 4 [json_name = "default_value"];
  string key_type = 5 [json_name = "key_type"];
  string comment = 6;
}

message SQLTableInfoResult {
  repeated SQLColumnMetadata columns = 1;
  int64 total = 2;
  int64 rows = 3;
}

message SQLTableColumnsResult {
  repeated SQLColumnMetadata columns = 1;
  int64 total = 2;
}

message SQLTableDDLResult {
  string create_sql = 1 [json_name = "create_sql"];
}

message SQLQueryStartResult {
  string id = 1;
  string query_id = 2 [json_name = "query_id"];
}

// SQL editor WebSocket frames share the HTTP query request/result payloads.
message SQLQueryWebSocketMessage {
  enum Type {
    unspecified = 0;
    ping = 1;
    pong = 2;
    query_execute = 3;
    query_id = 4;
    query_result = 5;
    query_kill = 6;
    error = 7;
    preclose = 8;
  }
  string id = 1;
  Type message_type = 2 [json_name = "message_type"];
  google.protobuf.Struct data = 3;
}

message SQLQueryOperation {
  string query_id = 1 [json_name = "query_id"];
  google.protobuf.Timestamp created_at = 2 [json_name = "created_at"];
  string statement_id = 3 [json_name = "statement_id"];
  string db_name = 4 [json_name = "db_name"];
  string status = 5;
  string err_msg = 6 [json_name = "err_msg"];
  int64 rows_affected = 7 [json_name = "rows_affected"];
}

message SQLQueryResultColumn {
  string name = 1;
  string type = 2;
}

message SQLQueryResultItem {
  string string = 1 [json_name = "String"];
  bool valid = 2 [json_name = "Valid"];
}

message SQLEmptySet {
  string msg = 1;
}

message SQLQueryResult {
  string query_id = 1 [json_name = "query_id"];
  string db_name = 2 [json_name = "db_name"];
  string statement_id = 3 [json_name = "statement_id"];
  string status = 4;
  string err_msg = 5 [json_name = "err_msg"];
  int64 offset = 6;
  int64 limit = 7;
  int64 total = 8;
  repeated SQLQueryResultColumn columns = 9;
  repeated google.protobuf.ListValue result = 10;
  SQLEmptySet empty_set = 11 [json_name = "empty_set"];
  int64 rows_affected = 12 [json_name = "rows_affected"];
  int64 elapsed_ms = 13 [json_name = "elapsed_ms"];
  bool truncated = 14;

}

message SQLQueryHistoryOverviewResult {
  int64 total = 1;
  int64 success = 2;
  int64 running = 3;
  int64 failed = 4;
}

message SQLStatementRecord {
  string statement_id = 1 [json_name = "statement_id"];
  string transaction_id = 2 [json_name = "transaction_id"];
  string session_id = 3 [json_name = "session_id"];
  string account = 4;
  string user = 5;
  string host = 6;
  string database = 7;
  string statement = 8;
  string statement_tag = 9 [json_name = "statement_tag"];
  string statement_fingerprint = 10 [json_name = "statement_fingerprint"];
  string node_uuid = 11 [json_name = "node_uuid"];
  string node_type = 12 [json_name = "node_type"];
  google.protobuf.Timestamp request_at = 13 [json_name = "request_at"];
  google.protobuf.Timestamp response_at = 14 [json_name = "response_at"];
  uint64 duration = 15;
  string status = 16;
  string error_code = 17 [json_name = "error_code"];
  string error = 18;
  string exec_plan = 19 [json_name = "exec_plan"];
  uint64 rows_read = 20 [json_name = "rows_read"];
  uint64 bytes_scan = 21 [json_name = "bytes_scan"];
  string statement_type = 22 [json_name = "statement_type"];
  string query_type = 23 [json_name = "query_type"];
  uint64 role_id = 24 [json_name = "role_id"];
  string sql_source_type = 25 [json_name = "sql_source_type"];
  int64 result_count = 26 [json_name = "result_count"];
  double cu = 27;
  int64 connection_id = 28 [json_name = "connection_id"];
}

message SQLQueryHistoryResult {
  int64 total = 1;
  uint64 offset = 2;
  uint64 limit = 3;
  repeated SQLStatementRecord query_list = 4 [json_name = "query_list"];
}

message SQLQueryProfileResult {
  string statement_id = 1 [json_name = "statement_id"];
  SQLExplainData profile = 2;
}

message SQLExplainData {
  repeated SQLExplainStep steps = 1;
  uint32 code = 2;
  string message = 3;
  bool success = 4;
  string uuid = 5;
}

message SQLExplainStep {
  SQLGraphData graph_data = 1 [json_name = "graphData"];
  int64 step = 2;
  string description = 3;
  string state = 4;
}

message SQLGraphData {
  repeated SQLGraphNode nodes = 1;
  repeated SQLGraphEdge edges = 2;
  repeated SQLGraphLabel labels = 3;
  SQLGraphGlobal global = 4;
}

message SQLGraphNode {
  string id = 1;
  string name = 2;
  string title = 3;
  repeated SQLGraphLabel labels = 4;
  SQLStatistics statistics = 5;
  SQLCost cost = 6;
  SQLTotalStats total_stats = 7 [json_name = "totalStats"];
}

message SQLGraphEdge {
  string id = 1;
  string src = 2;
  string dst = 3;
  int64 output = 4;
  string unit = 5;
}

message SQLGraphLabel {
  string name = 1;
  google.protobuf.Value value = 2;
}

message SQLGraphGlobal {
  SQLStatistics statistics = 1;
  SQLTotalStats total_stats = 2 [json_name = "totalStats"];
}

message SQLStatistics {
  repeated SQLStatisticValue memory = 1;
  repeated SQLStatisticValue throughput = 2;
  repeated SQLStatisticValue io = 3;
  repeated SQLStatisticValue network = 4;
}

message SQLCost {
  double start = 1;
  double total = 2;
  double card = 3;
  double ndv = 4;
  double rowsize = 5;
}

message SQLTotalStats {
  string name = 1;
  int64 value = 2;
  string unit = 3;
}

message SQLStatisticValue {
  string name = 1;
  int64 value = 2;
  string unit = 3;
}
