syntax = "proto3";

package matrixflow.sdk.product;

import "google/protobuf/struct.proto";

option go_package = "github.com/matrixorigin/moi-go-sdk/v5/product";

message AgentCardResult {
  string json = 1;
}

message AgentCatalogCard {
  string kind = 1;
  string id = 2;
  string workspace_id = 3;
  string name = 4;
  string description = 5;
  string avatar_ref = 6;
  string status = 7;
  int32 version = 8;
  string updated_at = 9;
  repeated string actions = 10;
  bool requires_agent_model = 11;
}

message AgentCatalogCardListResult {
  repeated AgentCatalogCard items = 1;
  int64 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

// Agent Team responses mirror the Catalog-owned wire contract.
message AgentTeamRecord {
	string id = 1;
	string workspace_id = 2;
	string owner_user_id = 3;
	string name = 4;
	string description = 5;
	string status = 6;
	int64 version = 7;
	int64 membership_version = 8;
	string created_at = 9;
	string updated_at = 10;
}

message AgentTeamMemberRef {
	string agent_workspace_id = 1;
	string agent_id = 2;
}

message AgentTeamMember {
	string team_id = 1;
	string agent_workspace_id = 2;
	string agent_id = 3;
	string created_at = 4;
}

message AgentTargetRef {
	string kind = 1;
	string workspace_id = 2;
	string id = 3;
}

message IngressConnection {
	string id = 1;
	string workspace_id = 2;
	AgentTargetRef target = 3;
	string provider = 4;
	string channel_type = 5;
	string receive_mode = 6;
	string channel_instance_id = 7;
	google.protobuf.Struct provider_config = 8;
	string agent_model = 9;
	string connected_by_user_id = 10;
	string account_identity = 11;
	int64 association_version = 12;
	int64 config_version = 13;
	bool enabled = 14;
	string desired_state = 15;
	string observed_state = 16;
	string last_receive_at = 17;
	string last_error_code = 18;
	string created_at = 19;
	string updated_at = 20;
	string callback_path = 21;
}

// Short-lived, user/workspace/target-bound WeCom robot authorization.
message WeComQRBindingResult {
	string status = 1;
	string session_token = 2;
	string qr_url = 3;
	string expires_at = 4;
	string bot_id = 5;
	string secret = 6;
}

message AgentTeamSession {
  string workspace_id = 1 [json_name = "WorkspaceID"];
  string team_id = 2 [json_name = "TeamID"];
  string context_id = 3 [json_name = "ContextID"];
  string name = 4 [json_name = "Name"];
  string astra_session_id = 5 [json_name = "AstraSessionID"];
  string created_via_ingress_connection_id = 6 [json_name = "CreatedViaIngressConnectionID"];
  string created_by_external_user_id = 7 [json_name = "CreatedByExternalUserID"];
  string created_by_moi_user_id = 8 [json_name = "CreatedByMOIUserID"];
  string updated_via_ingress_connection_id = 9 [json_name = "UpdatedViaIngressConnectionID"];
  string updated_by_external_user_id = 10 [json_name = "UpdatedByExternalUserID"];
  string updated_by_moi_user_id = 11 [json_name = "UpdatedByMOIUserID"];
  string active_task_id = 12 [json_name = "ActiveTaskID"];
  string pending_ingress_id = 13 [json_name = "PendingIngressID"];
  string last_answering_agent_workspace_id = 14 [json_name = "LastAnsweringAgentWorkspaceID"];
  string last_answering_agent_id = 15 [json_name = "LastAnsweringAgentID"];
  string created_at = 16 [json_name = "CreatedAt"];
  string updated_at = 17 [json_name = "UpdatedAt"];
  int64 version = 18 [json_name = "Version"];
}

message AgentTeamListResult {
  repeated AgentTeamRecord items = 1;
  int64 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message AgentTeamSessionListResult {
  repeated AgentTeamSession items = 1;
  int64 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message AgentTeamMemberList {
  repeated AgentTeamMember items = 1;
}

message IngressConnectionList {
	repeated IngressConnection items = 1;
	int64 total = 2;
}

message IngressCapability {
	string provider = 1;
	string channel_type = 2;
	repeated string receive_modes = 3;
}

message IngressCapabilityList {
	repeated IngressCapability items = 1;
}

message AgentTeamSelection {
	AgentTeamMemberRef member = 1;
	string reason = 2;
	int64 membership_version = 3;
	google.protobuf.Struct snapshot = 4;
}

message AgentTeamSubmitResult {
	string task_id = 1;
	AgentTeamSelection selection = 2;
}

message AgentTeamMessageListResult {
	repeated google.protobuf.Struct items = 1;
	int64 total = 2;
	int32 limit = 3;
	int32 offset = 4;
}

message AgentA2AResult {
  string json = 1;
}

message ConfirmSkillCandidateRequest {
  string call_id = 1 [json_name = "call_id"];
  string source_digest = 2 [json_name = "source_digest"];
  optional bool bind_current = 3 [json_name = "bind_current"];
}

message ConfirmSkillCandidateResult {
  string skill_id = 1 [json_name = "skill_id"];
  string workspace_id = 2 [json_name = "workspace_id"];
  string agent_id = 3 [json_name = "agent_id"];
  optional bool bound = 4;
}

message SkillCandidateConfirmationResult {
  string skill_id = 1 [json_name = "skill_id"];
  string workspace_id = 2 [json_name = "workspace_id"];
  string agent_id = 3 [json_name = "agent_id"];
  optional bool saved = 4;
  optional bool bound = 5;
}

message AgentRunner {
  string id = 1;
  string workspace_id = 2 [json_name = "workspace_id"];
  string user_id = 3 [json_name = "user_id"];
  string name = 4;
  string runner_type = 5 [json_name = "runner_type"];
  string edge_agent_id = 6 [json_name = "edge_agent_id"];
  optional string connect_cmd = 7 [json_name = "connect_cmd"];
  string phase = 8;
  optional string token_expires_at = 9 [json_name = "token_expires_at"];
  string created_at = 10 [json_name = "created_at"];
  string updated_at = 11 [json_name = "updated_at"];
}

message RunnerCreateRequest {
  string name = 1;
}

message SandboxEgressEndpoint {
  string host = 1;
  repeated uint32 ports = 2;
}

message AgentSandbox {
  string id = 1;
  string workspace_id = 2 [json_name = "workspace_id"];
  string user_id = 3 [json_name = "user_id"];
  string name = 4;
  string phase = 5;
  string edge_agent_id = 6 [json_name = "edge_agent_id"];
  string network_mode = 7 [json_name = "network_mode"];
  repeated string network_tools = 8 [json_name = "network_tools"];
  repeated SandboxEgressEndpoint egress_endpoints = 9 [json_name = "egress_endpoints"];
  string spec = 10;
  int32 disk_gi = 11 [json_name = "disk_gi"];
  string compute_resource_id = 12 [json_name = "compute_resource_id"];
  string created_at = 13 [json_name = "created_at"];
  string updated_at = 14 [json_name = "updated_at"];
  optional bool update_available = 15 [json_name = "update_available"];
  SandboxAdminWorkspace workspace = 16;
}

message SandboxAdminWorkspace {
  string id = 1;
  string name = 2;
  string owner_id = 3 [json_name = "owner_id"];
  string account_name = 4 [json_name = "account_name"];
}

message SandboxCreateRequest {
  string name = 1;
  string compute_resource_id = 2 [json_name = "compute_resource_id"];
  string spec = 3;
  int32 disk_gi = 4 [json_name = "disk_gi"];
  string network_mode = 5 [json_name = "network_mode"];
  repeated string network_tools = 6 [json_name = "network_tools"];
  repeated SandboxEgressEndpoint egress_endpoints = 7 [json_name = "egress_endpoints"];
}

message SandboxNetworkRequest {
  repeated string network_tools = 1 [json_name = "network_tools"];
  repeated SandboxEgressEndpoint egress_endpoints = 2 [json_name = "egress_endpoints"];
}

message SandboxQuotaStatus {
  int32 current = 1;
  int32 limit = 2;
  repeated SandboxEgressEndpoint default_egress_endpoints = 3 [json_name = "default_egress_endpoints"];
  // Present only when include_network_capabilities=true was requested.
  optional bool unrestricted_network_allowed = 4 [json_name = "unrestricted_network_allowed"];
}

message SandboxQuota {
  string workspace_id = 1 [json_name = "workspace_id"];
  int32 max_managed_count = 2 [json_name = "max_managed_count"];
  int32 max_ephemeral_count = 3 [json_name = "max_ephemeral_count"];
  int32 auto_ephemeral_override = 4 [json_name = "auto_ephemeral_override"];
  string updated_by = 5 [json_name = "updated_by"];
  string updated_at = 6 [json_name = "updated_at"];
}

message SandboxQuotaRequest {
  optional int32 max_managed_count = 1 [json_name = "max_managed_count"];
  optional int32 max_ephemeral_count = 2 [json_name = "max_ephemeral_count"];
  optional string auto_ephemeral = 3 [json_name = "auto_ephemeral"];
}

message SandboxAdminListResult {
  repeated AgentSandbox items = 1;
  int32 limit = 2;
  int32 offset = 3;
  bool has_more = 4 [json_name = "has_more"];
}

message SandboxSSHSession {
  string token = 1;
  string gateway_host = 2 [json_name = "gateway_host"];
  uint32 gateway_port = 3 [json_name = "gateway_port"];
  string gateway_scheme = 4 [json_name = "gateway_scheme"];
  string host_key_fingerprint = 5 [json_name = "host_key_fingerprint"];
  int64 expires_at_ms = 6 [json_name = "expires_at_ms"];
}

message SandboxTerminalToken {
  string token = 1;
  string expires_at = 2 [json_name = "expires_at"];
}

message ExecutorHealth {
  string id = 1;
  string name = 2;
  string type = 3;
  string phase = 4;
  string edge_agent_id = 5 [json_name = "edge_agent_id"];
  bool connected = 6;
  optional uint64 connected_secs = 7 [json_name = "connected_secs"];
  bool ready = 8;
}

message ExecutorHealthResponse {
  repeated ExecutorHealth executors = 1;
  bool astra_reachable = 2 [json_name = "astra_reachable"];
}

message FeedbackTicketMessageInput {
  string role = 1;
  string content = 2;
}

message FeedbackTicketAdminUpdateRequest {
  optional string status = 1;
  optional string admin_reply = 2 [json_name = "admin_reply"];
}
message FeedbackTicketCreateRequest {
  optional string title = 1;
  optional string description = 2;
  optional string expected_behavior = 3;
  optional string actual_behavior = 4;
  optional string reproduction_steps = 5;
  optional string suggested_priority = 6;
  repeated FeedbackTicketMessageInput messages = 7;
}

message AgentArtifact {
  string workspace_id = 1;
  string artifact_id = 2;
  int64 version = 3;
  string artifact_kind = 4;
  string status = 5;
  string file_id = 6;
  int64 placement_id = 7;
  int64 volume_id = 8;
  string file_path = 9;
  string file_name = 10;
  string content_type = 11;
  string file_category = 12;
  int64 size = 13;
  string md5 = 14;
  string agent_workspace_id = 15;
  string agent_id = 16;
  string agent_name = 17;
  string conversation_id = 18;
  string conversation_title = 19;
  string task_id = 20;
  string call_id = 21;
  string tool_id = 22;
  string created_by = 23;
  string creator_name = 24;
  string source_event_id = 25;
  int64 source_event_seq = 26;
  string generated_at = 27;
  string created_at = 28;
  string updated_at = 29;
}

message AgentArtifactAgentSource {
  string agent_workspace_id = 1;
  string agent_id = 2;
}

message AgentArtifactCreatorSource {
  string created_by = 1;
  string creator_name = 2;
}

message AgentArtifactListResult {
  repeated AgentArtifact items = 1;
  repeated AgentArtifactAgentSource agent_sources = 2;
  repeated AgentArtifactCreatorSource creator_sources = 3;
  int64 total = 4;
  int32 page = 5;
  int32 page_size = 6;
  string snapshot_at = 7;
}

message AgentArtifactRef {
  string artifact_id = 1;
  int64 version = 2;
}

message AgentArtifactFailure {
  string artifact_id = 1;
  int64 version = 2;
  string reason = 3;
}

message AgentArtifactBatchRequest {
  repeated AgentArtifactRef items = 1;
}

message AgentArtifactDeleteResult {
  repeated AgentArtifactRef succeeded = 1;
  repeated AgentArtifactFailure failed = 2;
}

message AgentArtifactResolveItem {
  string artifact_id = 1;
  int64 version = 2;
  string file_id = 3;
  int64 volume_id = 4;
  int64 placement_id = 5;
  string file_name = 6;
  string content_type = 7;
  int64 size = 8;
  string status = 9;
}

message AgentArtifactResolveResult {
  repeated AgentArtifactResolveItem items = 1;
  repeated AgentArtifactFailure failed = 2;
}

message AgentArtifactBackfillRequest {
  bool dry_run = 1;
  int32 limit = 2;
}

message AgentArtifactBackfillResult {
  int64 scanned = 1;
  int64 inserted = 2;
  int64 skipped = 3;
  int64 failed = 4;
  bool dry_run = 5;
}
